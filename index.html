<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<section class="grid">

<button>🏨 飯店</button>

<button>🚕 計程車</button>
<button>☕ 咖啡廳</button>

</section>

<div class="card">
<h2>안녕하세요</h2>
<p>Annyeonghaseyo</p>
<p>您好</p>
<button onclick="speak()">🔊 發音</button>

<script src="js/app.js"></script>

</html>
