<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff7aa8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HanTalk">
  <title>HanTalk｜旅行韓文</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{--pink:#ff7aa8;--pink2:#ffd8e7;--bg:#fff7fa;--text:#25222a;--muted:#77727d;--card:#fff;--line:#f0e6eb}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Arial,sans-serif;color:var(--text)}
    button,input{font:inherit} .app{max-width:720px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom))}
    header{padding:24px 4px 10px} h1{margin:0;font-size:34px} .sub{color:var(--muted);margin-top:6px}
    .hero{background:linear-gradient(135deg,#ff8db4,#ffc8dc);padding:20px;border-radius:24px;color:white;margin:10px 0 18px;box-shadow:0 12px 28px #ff9abd40}
    .hero b{font-size:22px} .hero p{margin:8px 0 0;opacity:.95}
    .search{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 78%,transparent);padding:8px 0 14px}
    .search input{width:100%;border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:white;box-shadow:0 5px 16px #70505d12;outline:none}
    .chips{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none} .chips::-webkit-scrollbar{display:none}
    .chip{border:0;background:white;padding:10px 14px;border-radius:999px;white-space:nowrap;color:var(--text);box-shadow:0 3px 10px #70505d12}
    .chip.active{background:var(--pink);color:white}
    .section-title{display:flex;justify-content:space-between;align-items:center;margin:10px 2px} .section-title h2{font-size:20px;margin:0}
    .count{font-size:13px;color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 7px 18px #70505d10}
    .kr{font-size:24px;font-weight:750;line-height:1.35} .roman{color:var(--muted);margin-top:6px} .zh{font-size:17px;margin-top:8px}
    .tag{display:inline-block;font-size:12px;background:#fff0f6;color:#b64e77;padding:5px 9px;border-radius:999px;margin-top:10px}
    .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap} .action{border:0;border-radius:12px;padding:10px 12px;background:#fff0f6;color:#7f3150}
    .action.primary{background:var(--pink);color:white} .empty{text-align:center;color:var(--muted);padding:50px 10px}
    nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(720px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#ffffffef;backdrop-filter:blur(15px);border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:10}
    nav button{border:0;background:transparent;padding:8px 3px;color:var(--muted);font-size:12px} nav button span{display:block;font-size:22px;margin-bottom:2px} nav button.active{color:var(--pink)}
    .panel{display:none} .panel.active{display:block}
    .daily{text-align:center} .daily .kr{font-size:30px} .quiz-options{display:grid;gap:10px;margin-top:14px} .quiz-options button{border:1px solid var(--line);background:white;padding:13px;border-radius:13px;text-align:left}
    .quiz-options button.correct{background:#eaf9ef;border-color:#79c995} .quiz-options button.wrong{background:#fff0f0;border-color:#e58b8b}
    .fullscreen{position:fixed;inset:0;background:white;z-index:30;display:none;align-items:center;justify-content:center;text-align:center;padding:32px}

  </style>
</head>
<body>
<div class="app">
  <header><h1>🇰🇷 HanTalk</h1><div class="sub">旅行韓文，打開就能用</div></header>

  <main>
    <section id="home" class="panel active">
      <div class="hero"><b>今天學一句韓文吧！</b><p>搜尋、收藏、發音、放大給韓國人看。</p></div>
      <div class="search"><input id="searchInput" placeholder="搜尋中文、韓文或羅馬拼音"></div>
      <div id="chips" class="chips"></div>
      <div class="section-title"><h2 id="listTitle">全部句子</h2><span id="count" class="count"></span></div>
      <div id="list"></div>
    </section>

    <section id="favorites" class="panel">
      <div class="section-title"><h2>⭐ 我的收藏</h2><span id="favCount" class="count"></span></div>
      <div id="favList"></div>
    </section>

    <section id="daily" class="panel">
      <div class="card daily">
        <div class="tag">今日一句</div>
        <div id="dailyKr" class="kr"></div>
        <div id="dailyRoman" class="roman"></div>
        <div id="dailyZh" class="zh"></div>
        <div class="actions" style="justify-content:center">
          <button class="action primary" id="dailySpeak">🔊 發音</button>
          <button class="action" id="dailyNext">換一句</button>
        </div>
      </div>
      <div class="section-title"><h2>📝 小測驗</h2></div>
      <div class="card">
        <div id="quizQuestion" class="zh"></div>
        <div id="quizOptions" class="quiz-options"></div>
        <div class="actions"><button class="action" id="nextQuiz">下一題</button></div>
      </div>
    </section>

    <section id="about" class="panel">
      <div class="card">
        <h2>關於 HanTalk</h2>
        <p>為韓國自由行設計的初學者韓文工具。</p>
        <div class="notice">發音使用 iPhone／瀏覽器內建的韓語語音。若沒有聲音，請確認手機不是靜音，並再點一次發音。</div>
        <p>版本：正式版 v3.0</p>
      </div>
    </section>
  </main>
</div>

<nav>
  <button class="nav active" data-panel="home"><span>🏠</span>首頁</button>
  <button class="nav" data-panel="daily"><span>📖</span>學習</button>
  <button class="nav" data-panel="favorites"><span>⭐</span>收藏</button>
  <button class="nav" data-panel="about"><span>👤</span>關於</button>
</nav>

<div id="fullscreen" class="fullscreen"><div><div id="fullKr" class="kr"></div><div id="fullZh" class="zh"></div></div><small>點一下畫面關閉</small></div>

const cats = ["全部", ...new Set(DATA.map(x=>x.cat))];
let currentCat = "全部";
let query = "";
let favorites = JSON.parse(localStorage.getItem("hantalk_favorites") || "[]");

const $ = s => document.querySelector(s);
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

function speak(text, rate=0.86) {
  if (!("speechSynthesis" in window)) return alert("此瀏覽器不支援語音播放");
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ko-KR"; u.rate = rate; u.pitch = 1;
  speechSynthesis.speak(u);
}

function renderChips() {
  $("#chips").innerHTML = cats.map(c => `<button class="chip ${c===currentCat?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    currentCat = b.dataset.cat; renderChips(); renderList();
  });
}

function filtered() {
  const q = query.trim().toLowerCase();
  return DATA.filter(x => (currentCat==="全部" || x.cat===currentCat) &&
    (!q || x.kr.toLowerCase().includes(q) || x.zh.toLowerCase().includes(q) || x.roman.toLowerCase().includes(q)));
}

function card(x) {
  const id = DATA.indexOf(x);
  const liked = favorites.includes(id);
  return `<article class="card">
    <div class="kr">${escapeHtml(x.kr)}</div>
    <div class="roman">${escapeHtml(x.roman)}</div>
    <div class="zh">${escapeHtml(x.zh)}</div>
    <span class="tag">${escapeHtml(x.cat)}</span>
    <div class="actions">
      <button class="action primary speak" data-id="${id}">🔊 發音</button>
      <button class="action slow" data-id="${id}">🐢 慢速</button>
      <button class="action fav" data-id="${id}">${liked?'💖 已收藏':'🤍 收藏'}</button>
      <button class="action full" data-id="${id}">📱 放大</button>
    </div>
  </article>`;
}

function bindCards(scope=document) {
  scope.querySelectorAll(".speak").forEach(b=>b.onclick=()=>speak(DATA[+b.dataset.id].kr));
  scope.querySelectorAll(".slow").forEach(b=>b.onclick=()=>speak(DATA[+b.dataset.id].kr,0.58));
  scope.querySelectorAll(".fav").forEach(b=>b.onclick=()=>toggleFav(+b.dataset.id));
  scope.querySelectorAll(".full").forEach(b=>b.onclick=()=>showFull(+b.dataset.id));
}

function renderList() {
  const arr = filtered();
  $("#listTitle").textContent = currentCat==="全部" ? "全部句子" : currentCat;
  $("#count").textContent = `${arr.length} 句`;
  $("#list").innerHTML = arr.length ? arr.map(card).join("") : `<div class="empty">找不到符合的句子</div>`;
  bindCards($("#list"));
}

function toggleFav(id) {
  favorites = favorites.includes(id) ? favorites.filter(x=>x!==id) : [...favorites,id];
  localStorage.setItem("hantalk_favorites", JSON.stringify(favorites));
  renderList(); renderFavorites();
}

function renderFavorites() {
  const arr = favorites.map(i=>DATA[i]).filter(Boolean);
  $("#favCount").textContent = `${arr.length} 句`;
  $("#favList").innerHTML = arr.length ? arr.map(card).join("") : `<div class="empty">還沒有收藏<br>在句子卡片按「收藏」即可加入</div>`;
  bindCards($("#favList"));
}

function showFull(id) {
  $("#fullKr").textContent = DATA[id].kr;
  $("#fullZh").textContent = DATA[id].zh;
  $("#fullscreen").classList.add("show");
}

$("#fullscreen").onclick = ()=>$("#fullscreen").classList.remove("show");
$("#searchInput").oninput = e => { query=e.target.value; renderList(); };

document.querySelectorAll(".nav").forEach(b => b.onclick = () => {
  document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); $("#"+b.dataset.panel).classList.add("active");
  if (b.dataset.panel==="favorites") renderFavorites();
});

let dailyIndex = new Date().getDate() % DATA.length;
function renderDaily() {
  const x=DATA[dailyIndex];
  $("#dailyKr").textContent=x.kr; $("#dailyRoman").textContent=x.roman; $("#dailyZh").textContent=x.zh;
}
$("#dailySpeak").onclick=()=>speak(DATA[dailyIndex].kr);
$("#dailyNext").onclick=()=>{dailyIndex=(dailyIndex+1)%DATA.length;renderDaily()};

let quizAnswer=0;
function makeQuiz() {
  quizAnswer=Math.floor(Math.random()*DATA.length);
  const correct=DATA[quizAnswer], ids=[quizAnswer];
  while(ids.length<4) { const n=Math.floor(Math.random()*DATA.length); if(!ids.includes(n)) ids.push(n); }
  ids.sort(()=>Math.random()-.5);
  $("#quizQuestion").textContent=`「${correct.zh}」的韓文是？`;
  $("#quizOptions").innerHTML=ids.map(i=>`<button data-id="${i}">${escapeHtml(DATA[i].kr)}</button>`).join("");
  $("#quizOptions").querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
    $("#quizOptions").querySelectorAll("button").forEach(x=>x.disabled=true);
    btn.classList.add(+btn.dataset.id===quizAnswer?"correct":"wrong");
    $("#quizOptions").querySelector(`[data-id="${quizAnswer}"]`).classList.add("correct");
  });
}
$("#nextQuiz").onclick=makeQuiz;

renderChips(); renderList(); renderFavorites(); renderDaily(); makeQuiz();
if ("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
