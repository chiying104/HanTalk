<!DOCTYPE html>
<html lang="zh-Hant">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HanTalk Demo</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff4f8;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:#fff;padding:30px;border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,.1);text-align:center;width:320px}
button{background:#ff5d8f;color:#fff;border:0;padding:12px 18px;border-radius:12px;font-size:16px}
.small{color:#666}
</style>
<div class="card">
<h1>🇰🇷 HanTalk Demo</h1>
<h2>안녕하세요</h2>
<p><b>Annyeonghaseyo</b></p>
<p>您好</p>
<button onclick="play()">🔊 播放韓文</button>
<p class="small">這是第一個測試版本</p>
</div>
<script>
function play(){
const u=new SpeechSynthesisUtterance("안녕하세요");
u.lang="ko-KR";
speechSynthesis.speak(u);
}
</script>
</html>
